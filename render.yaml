services:
  - type: web
    name: chronomind
    env: python
    buildCommand: pip install -r requirements.txt && python build_rag.py && python build_persona.py
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
